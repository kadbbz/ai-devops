name: ai-devops
x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: mysql://devops:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}@mysql:3306/devops_platform
  GIT_BASE_URL: http://git-service:3000
  FILE_ROOT: /var/lib/devops/files
  AUDIT_ROOT: /var/log/devops/audit
  WORKSPACE_ROOT: /var/lib/devops/workspaces
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_PROVIDER: ${AI_PROVIDER:-configured}
services:
  devops-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-devops-platform:local
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      git-service: { condition: service_healthy }
    environment:
      <<: *app-environment
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["127.0.0.1:${DEVOPS_PORT:-8080}:8080"]
    volumes:
      - platform_files:/var/lib/devops/files
      - workspace_data:/var/lib/devops/workspaces
      - audit_logs:/var/log/devops/audit
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  devops-worker:
    image: ai-devops-platform:local
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      git-service: { condition: service_healthy }
    environment: *app-environment
    volumes:
      - platform_files:/var/lib/devops/files
      - workspace_data:/var/lib/devops/workspaces
      - audit_logs:/var/log/devops/audit
      - ./test-commands.example.json:/etc/devops/test-commands.json:ro
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.js"]
      interval: 15s
      timeout: 5s
      retries: 4
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: devops_platform
      MYSQL_USER: devops
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      GITEA_DB_PASSWORD: ${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u devops -e 'SELECT 1' devops_platform >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
  git-service:
    image: docker.gitea.com/gitea:1.24.6-rootless@sha256:91f2b27e080739f0d19dba716c3214f17257c632cf762e545b44ca577e37052c
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      GITEA__database__DB_TYPE: mysql
      GITEA__database__HOST: mysql:3306
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD}
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__ROOT_URL: http://localhost:${GIT_PORT:-3000}/
      GITEA__server__SSH_PORT: ${GIT_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: 2222
    ports: ["127.0.0.1:${GIT_PORT:-3000}:3000", "127.0.0.1:${GIT_SSH_PORT:-2222}:2222"]
    volumes:
      - git_data:/var/lib/gitea
      - git_config:/etc/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
  git_data:
  git_config:
  platform_files:
  workspace_data:
  audit_logs:
