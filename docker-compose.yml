name: ai-native-devops
services:
  devops:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-native-devops:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEVOPS_PORT:-8080}:8080"
    volumes:
      - data:/data
      - backup:/backup
    environment:
      TZ: Asia/Shanghai
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "devopsctl", "health", "--ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
volumes:
  data:
  backup:
